name: wwtd
x-api: &api
  build: ../backend
  restart: unless-stopped
  environment: &env
    DATABASE_URL: ${DATABASE_URL:?Set the shared Supabase Postgres connection URL}
    SUPABASE_URL: ${SUPABASE_URL:-}
    SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    JWT_SECRET: ${JWT_SECRET:?Set a shared strong JWT secret}
    CORS_ORIGINS: ${CORS_ORIGINS:?Set frontend origins}
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
    interval: 10s
    timeout: 6s
    retries: 6
services:
  blue:
    <<: *api
    image: ${BLUE_IMAGE:-wwtd-api:blue}
    environment:
      <<: *env
      AUTH_MODE: password
      DEPLOYMENT_COLOR: blue
    ports: ["127.0.0.1:8081:8000"]
  green:
    <<: *api
    image: ${GREEN_IMAGE:-wwtd-api:green}
    environment:
      <<: *env
      AUTH_MODE: ${GREEN_AUTH_MODE:-google}
      DEPLOYMENT_COLOR: green
    ports: ["127.0.0.1:8082:8000"]
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./routes:/routes:ro
      - router-state:/etc/nginx/conf.d
    command: ["sh", "-c", "test -f /etc/nginx/conf.d/default.conf || cp /routes/blue.conf /etc/nginx/conf.d/default.conf; exec nginx -g 'daemon off;'"]
    depends_on:
      blue:
        condition: service_healthy
volumes:
  router-state:
